name: N71 verification

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compile_kernel_rfc:
        description: "Fetch pinned upstream Linux and compile modified N71 driver objects (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: "OFFLINE | protocol, privacy, manifest, evidence"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test without any phone or private data
        run: |
          python3 --version
          make test
          python3 scripts/validate_project.py
          python3 tools/security/check_git_privacy.py

  arm64-userspace:
    name: "BUILD | public AArch64 userspace diagnostics"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install public cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libbluetooth-dev binutils-aarch64-linux-gnu
      - name: Cross-compile all four independent AArch64 tools
        run: |
          # Use only the architecture-neutral BlueZ API header directory,
          # never -I/usr/include (host glibc can pollute ARM64 builds).
          mkdir -p "$RUNNER_TEMP/bluez-include/bluetooth"
          cp /usr/include/bluetooth/*.h "$RUNNER_TEMP/bluez-include/bluetooth/"
          make clean
          make all BLUEZ_HEADERS="$RUNNER_TEMP/bluez-include"
          for f in build/*-aarch64; do
            file "$f"
            LC_ALL=C aarch64-linux-gnu-readelf -h "$f" | grep -q 'Machine:.*AArch64'
          done
      - name: Export public-source binaries only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aarch64-diagnostics-${{ github.sha }}
          path: build/*-aarch64
          if-no-files-found: error
          retention-days: 7

  kernel-rfc-build:
    name: "BUILD | pinned A9 kernel RFC objects (manual opt-in)"
    if: github.event_name == 'workflow_dispatch' && inputs.compile_kernel_rfc
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install open-source ARM64 kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev device-tree-compiler
      - name: Fetch exact upstream kernel commit
        run: python3 scripts/fetch_upstreams.py --component linux --destination "$RUNNER_TEMP/upstreams"
      - name: Apply and compile experimental N71 RFC sources
        run: bash scripts/check_kernel_rfc.sh "$RUNNER_TEMP/upstreams/linux" "$RUNNER_TEMP/kernel-out"
      - name: Never upload kernel images, firmware or board data
        run: echo "Only the job status and compiler diagnostics are retained."
